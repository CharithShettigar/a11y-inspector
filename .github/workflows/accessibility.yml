name: Accessibility Check

on:
  pull_request:
    branches:
      - main

jobs:
  pa11y-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Pa11y
        run: npm install -g pa11y serve

      - name: Run Accessibility Check
        run: |
          mkdir report
          npx serve . -p 5000 &
          sleep 20 # Increased sleep duration
          pa11y --reporter html --config config.json > report/pa11y-report.html

      - name: Upload Accessibility Report
        uses: actions/upload-artifact@v4
        with:
          name: pa11y-accessibility-report
          path: report/pa11y-report.html

